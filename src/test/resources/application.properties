spring.datasource.url=jdbc:h2:mem:devquery;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.sql.init.mode=always
spring.jpa.show-sql=true

# Spring AI key for tests
spring.ai.google.genai.api-key=dummy-test-key
spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite

# Mail configuration for tests
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@gmail.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.base-url=http://localhost:8080

# Security OAuth2 dummy config
spring.security.oauth2.client.registration.github.client-id=dummy
spring.security.oauth2.client.registration.github.client-secret=dummy
spring.security.oauth2.client.registration.google.client-id=dummy
spring.security.oauth2.client.registration.google.client-secret=dummy
spring.security.oauth2.client.registration.google.scope=profile,email

# Practice lab
practice-lab.piston.api-url=http://localhost:2000/api/v2/execute
practice-lab.timeout=10000
practice-lab.max-code-size=102400
