<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <script>
        if (localStorage.getItem('devquery-theme') === 'dark') {
            document.write('<style>body { background-color: #2d3135 !important; }</style>');
        }
    </script>
</head>

<body>

    <div th:fragment="profileTemplate(activeTab)">
        <div class="d-flex justify-content-between mb-5">

            <div class="d-flex">
                <div class="me-4">
                    <img th:src="${uPro.avatarUrl != null and !#strings.isEmpty(uPro.avatarUrl) ? uPro.avatarUrl : '/assets/img/avatar/default_avatar.jpg'}"
                        onerror="this.onerror=null; this.src='/assets/img/avatar/default-avatar.jpg';" alt="Avatar"
                        class="rounded-circle shadow-sm" style="width: 144px; height: 144px; object-fit: cover;">
                </div>

                <div class="pt-1">
                    <h1 class="user-name mb-2" th:text="${uPro.username}">Username</h1>

                    <div class="user-meta mb-3">
                        <i class="fa-solid fa-cake-candles me-1"></i> Member since <span
                            th:text="${#dates.format(uPro.createdAt, 'MMM dd, yyyy')}">Date</span>

                        <span class="mx-2">|</span>
                        <i class="fa-solid fa-star text-warning me-1"></i> <span th:text="${uPro.reputation}">0</span>
                        reputation

                        <th:block th:if="${not #strings.isEmpty(uPro.location)}">
                            <span class="mx-2">|</span>
                            <i class="fa-solid fa-location-dot me-1"></i> <span
                                th:text="${uPro.location}">Location</span>
                        </th:block>
                    </div>

                    <ul class="nav profile-tabs">
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${activeTab == 'profile' ? 'active' : ''}"
                                th:href="@{/profile(id=${uPro.userId})}">Profile</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${activeTab == 'activity' ? 'active' : ''}"
                                th:href="@{/activity(id=${uPro.userId}, tab='summary')}">Activity</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${activeTab == 'badge' ? 'active' : ''}"
                                th:href="@{/badge(id=${uPro.userId})}">Badge</a>
                        </li>
                        <th:block sec:authorize="isAuthenticated()"
                            th:if="${loggedInUser != null && loggedInUser.userId == uPro.userId}">
                            <li class="nav-item">
                                <a class="nav-link" th:classappend="${activeTab == 'saves' ? 'active' : ''}"
                                    th:href="@{/saves(id=${uPro.userId})}">Saves</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:classappend="${activeTab == 'preferences' ? 'active' : ''}"
                                    th:href="@{/settings/preferences}">Preferences</a>
                            </li>
                            <li class="nav-item" th:if="${loggedInUser != null && loggedInUser.userId == uPro.userId}">
                                <a class="nav-link" th:classappend="${activeTab == 'drafts' ? 'active' : ''}"
                                    th:href="@{/questions/drafts}">Drafts</a>
                            </li>
                        </th:block>
                    </ul>
                </div>
            </div>

            <div class="pt-2">
                <th:block sec:authorize="isAuthenticated()">
                    <a th:if="${loggedInUser != null && loggedInUser.userId == uPro.userId}" th:href="@{/edit-profile}"
                        class="btn btn-outline-secondary btn-sm text-secondary">
                        <i class="fas fa-pencil-alt me-1"></i> Edit profile
                    </a>
                    <a th:if="${loggedInUser != null && loggedInUser.userId == uPro.userId}"
                        th:href="@{/change-password}" class="btn btn-outline-secondary btn-sm profile-action-btn">
                        <i class="fa-solid fa-key"></i>
                        Change Password
                    </a>
                </th:block>
            </div>

        </div>
    </div>
    <!-- CSS OVERRIDE: Ensure the tab panes don't get stuck in a hidden state -->
    <style>
        .tab-pane {
            display: none !important;
        }

        .tab-pane.active,
        .tab-pane.show.active {
            display: block !important;
        }
    </style>

    <!-- Strict UI Lock to physically prevent spam-clicking -->
    <div id="ui-lock-overlay"
        style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:9999; background:rgba(255,255,255,0.0); cursor:wait;">
    </div>

    <!-- AJAX Tab Navigation with AbortController to fix blank screen issue -->
    <script>
        if (!window.hasAjaxTabsInitialized) {
            window.hasAjaxTabsInitialized = true;
            (function () {
                let abortController = null;
                let isTabSwitching = false; // Boolean lock flag to prevent race conditions

                document.addEventListener('click', async function (e) {
                    const tab = e.target.closest('.profile-tabs .nav-link, .activity-nav .list-group-item');
                    if (!tab) return;

                    const targetUrl = tab.getAttribute('href');
                    if (!targetUrl || targetUrl === '#' || targetUrl.startsWith('javascript:')) return;

                    e.preventDefault();

                    // Prevent duplicate clicks on the already active tab during a switch
                    if (isTabSwitching) {
                        return;
                    }

                    // Engage the physical UI lock overlay to strictly prevent all spam-clicking
                    const uiLock = document.getElementById('ui-lock-overlay');
                    if (uiLock) uiLock.style.display = 'block';

                    // Abort any ongoing fetch request if the user rapidly switches tabs
                    if (abortController) {
                        abortController.abort();
                    }
                    abortController = new AbortController();

                    isTabSwitching = true; // Engage the lock flag

                    // Strictly manage .active class: Safely remove it from all .nav-link elements 
                    // (Note: .tab-pane elements do not exist in this architecture)
                    const navGroup = tab.closest('.nav, .list-group');
                    if (navGroup) {
                        navGroup.querySelectorAll('.nav-link, .list-group-item').forEach(t => t.classList.remove('active'));
                    }
                    // Apply it to the newly clicked target
                    tab.classList.add('active');

                    // Add loading state to content area to prevent empty/blank DOM
                    const mainContent = document.querySelector('.main-content');
                    if (mainContent) {
                        mainContent.style.opacity = '0.5';
                        mainContent.style.pointerEvents = 'none';
                    }

                    try {
                        const response = await fetch(targetUrl, {
                            signal: abortController.signal,
                            headers: {
                                'X-Requested-With': 'XMLHttpRequest'
                            }
                        });

                        if (!response.ok) {
                            window.location.href = targetUrl; // Fallback
                            return;
                        }

                        const html = await response.text();
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');

                        const newMainContent = doc.querySelector('.main-content');
                        if (newMainContent && mainContent) {
                            mainContent.innerHTML = newMainContent.innerHTML;
                            mainContent.style.opacity = '1';
                            mainContent.style.pointerEvents = 'auto';

                            // Re-execute scripts inside the new content (like Chart.js in summary)
                            const scripts = mainContent.querySelectorAll('script');
                            scripts.forEach(oldScript => {
                                const newScript = document.createElement('script');
                                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                                oldScript.parentNode.replaceChild(newScript, oldScript);
                            });

                            // Update URL without reloading
                            window.history.pushState({ path: targetUrl }, '', targetUrl);
                        } else {
                            window.location.href = targetUrl; // Fallback
                        }
                    } catch (error) {
                        if (error.name === 'AbortError') {
                            console.log('Fetch aborted for rapid tab switch');
                        } else {
                            window.location.href = targetUrl; // Fallback
                        }
                    } finally {
                        isTabSwitching = false; // Release the lock
                        // The UI Lock will naturally be removed by DOM replacement, 
                        // but if an error occurred, we manually release it here:
                        const currentUiLock = document.getElementById('ui-lock-overlay');
                        if (currentUiLock) currentUiLock.style.display = 'none';
                    }
                });

                // Handle browser back/forward buttons correctly
                window.addEventListener('popstate', function () {
                    window.location.reload();
                });
            })();
        }
    </script>
</body>

</html>
