<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
</head>

<body>
    <nav th:fragment="header" class="navbar navbar-expand-lg navbar-light fixed-top navbar-devquery">
        <script>
            (function () {
                try {
                    // Admin pages always use light theme
                    if (window.location.pathname.startsWith('/admin')) {
                        document.documentElement.setAttribute('data-theme', 'light');
                        document.documentElement.classList.remove('dark-theme');
                        document.body.classList.remove('dark-theme');
                        return;
                    }

                    var theme = localStorage.getItem('devquery-theme');
                    var isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

                    if (theme === 'dark' || (theme === 'system' && isSystemDark) || (!theme && isSystemDark)) {
                        document.documentElement.setAttribute('data-theme', 'dark');
                        document.documentElement.classList.add('dark-theme');
                        document.body.classList.add('dark-theme');

                        document.write('<style id="anti-fouc-header">.navbar-devquery { background-color: #232629 !important; border-bottom: 1px solid #4a4e51 !important; transition: none !important; } * { transition: background-color 0s !important; }</style>');
                    } else {
                        document.documentElement.setAttribute('data-theme', 'light');
                        document.documentElement.classList.remove('dark-theme');
                        document.body.classList.remove('dark-theme');
                    }
                } catch (e) { }
            })();
        </script>
        <style>
            .navbar-devquery {
                border-top: 3px solid var(--orange, #f48024);
                background-color: var(--bg-panel, #ffffff);
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 1px 4px rgba(0, 0, 0, 0.05);
                height: 56px;
            }

            .search-box {
                transition: all 0.3s ease;
                border: 1px solid #babfc4;
            }

            .search-box:focus {
                border-color: #3b4045;
                box-shadow: 0 0 0 4px rgba(0, 149, 255, 0.15);
            }

            .btn-auth {
                font-weight: 500;
                font-size: 0.9rem;
            }

            .avatar-img {
                object-fit: cover;
            }

            .noti-badge {
                position: absolute;
                top: 2px;
                right: 2px;
                background: #d0393e;
                color: white;
                border-radius: 50%;
                padding: 2px 5px;
                font-size: 10px;
                font-weight: bold;
            }
        </style>

        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center me-4 ms-4" th:href="@{/home}">
                <img th:src="@{/assets/img/logo-icon.png}" alt="DevQuery Icon" width="35" height="35" class="me-2"
                    style="object-fit: contain;">

                <span class="fw-bold text-dark"
                    style="font-family: 'Segoe UI', Arial, sans-serif; font-size: 1.3rem; letter-spacing: -0.5px;">DevQuery</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <form class="d-flex mx-auto" style="max-width: 500px; width: 100%;" th:action="@{/search}" method="GET">
                    <div class="input-group position-relative w-100">
                        <span class="position-absolute top-50 start-0 translate-middle-y ms-2 text-secondary z-index-1"
                            style="z-index: 10;">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <input class="form-control rounded ps-5 search-box" type="search" name="q"
                            placeholder="Search questions, tags, or users..." aria-label="Search" />
                    </div>
                </form>

                <ul class="navbar-nav ms-auto align-items-center gap-2 mt-2 mt-lg-0">
                    <th:block sec:authorize="isAuthenticated()">
                        <li class="nav-item me-2" sec:authorize="hasAnyRole('ADMIN', 'MODERATOR')">
                            <a id="btn-nav-home" class="btn btn-outline-primary btn-sm btn-auth d-none"
                                th:href="@{/home}" title="Trở về trang chủ">
                                <i class="fa-solid fa-house me-1"></i> Home
                            </a>

                            <a id="btn-nav-admin" class="btn btn-outline-danger btn-sm btn-auth d-none"
                                th:href="@{/admin}" title="Vào trang quản trị">
                                <i class="fa-solid fa-user-shield me-1"></i> Admin
                            </a>

                            <script>
                                if (window.location.pathname.startsWith('/admin')) {
                                    document.getElementById('btn-nav-home').classList.remove('d-none');
                                } else {
                                    document.getElementById('btn-nav-admin').classList.remove('d-none');
                                }
                            </script>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center py-0" th:href="@{/profile}">
                                <img th:src="${loggedInUser != null and loggedInUser.avatarUrl != null and !#strings.isEmpty(loggedInUser.avatarUrl) ? loggedInUser.avatarUrl : '/assets/img/avatar/default-avatar.jpg'}"
                                    onerror="this.onerror=null; this.src='/assets/img/avatar/default-avatar.jpg';"
                                    alt="Avatar" width="32" height="32"
                                    class="rounded-circle bg-light border avatar-img" />
                                <span class="ms-2 fw-bold text-dark small"
                                    th:text="${loggedInUser?.username ?: 'User'}">User</span>
                            </a>
                        </li>
                        <li class="nav-item position-relative me-3" id="noti-bell-item" sec:authorize="!hasAnyRole('ADMIN','MODERATOR')">
                            <a class="nav-link text-secondary" href="#" id="noti-bell-link">
                                <i class="fa-solid fa-inbox fa-lg"></i>
                                <span id="noti-badge-count" class="noti-badge" th:if="${unreadNotification != null}"
                                    th:text="${unreadNotification}">2</span>
                            </a>
                            <div class="noti-dropdown d-none" id="noti-dropdown-menu">
                                <div class="noti-dropdown-header d-flex justify-content-between align-items-center">
                                    <span class="fw-bold">INBOX</span>
                                    <a href="#" class="text-primary small text-decoration-none" id="noti-mark-all">Mark all as read</a>
                                </div>
                                <div class="noti-dropdown-body" id="noti-list">
                                    <!-- Items injected via JS -->
                                    <div class="p-3 text-center text-secondary small">Loading...</div>
                                </div>
                                <div class="noti-dropdown-footer text-center">
                                    <a href="#" class="text-secondary small text-decoration-none">View all notifications</a>
                                </div>
                            </div>
                        </li>
                        <li class="nav-item me-4">
                            <form th:action="@{/auth/logout}" method="post" class="m-0">
                                <button type="submit" class="btn btn-outline-secondary btn-sm btn-auth"
                                    onclick="localStorage.removeItem('devquery_chat_html'); localStorage.removeItem('devquery_quick_replies');">
                                    <i class="fa-solid fa-right-from-bracket"></i>
                                </button>
                            </form>
                        </li>
                    </th:block>

                    <th:block sec:authorize="isAnonymous()">
                        <li class="nav-item"><a class="btn btn-outline-primary btn-sm btn-auth px-3"
                                th:href="@{/auth/login}">Log in</a></li>
                        <li class="nav-item"><a class="btn btn-primary btn-sm btn-auth px-3 me-4"
                                th:href="@{/auth/register}">Sign up</a></li>
                    </th:block>
                </ul>
            </div>
        </div>

        <style id="devquery-semantic-classes">
            /* Semantic Classes for Light Mode */
            .bg-white {
                background-color: #ffffff;
            }

            .bg-light {
                background-color: #f8f9f9;
            }

            .text-dark {
                color: #212529;
            }

            .text-secondary {
                color: #6a737c;
            }

            .border {
                border-color: #d6d9dc;
            }

            .so-link {
                color: #0074cc;
            }

            .bg-primary {
                background-color: #0a95ff;
                color: #fff;
            }

            .chip-gold {
                background-color: #fffdf0;
                border-color: #f1c40f;
                color: #8a6d3b;
            }

            .sticker-gold,
            .text-warning {
                color: #f1c40f;
            }

            .chip-silver {
                background-color: #f8f9f9;
                border-color: #adb5bd;
                color: #555;
            }

            .sticker-silver {
                color: #adb5bd;
            }

            .chip-bronze {
                background-color: #fff5ee;
                border-color: #d35400;
                color: #a0522d;
            }

            .sticker-bronze {
                color: #d35400;
            }

            .answered-accepted {
                background-color: #d1f7c4;
                color: #148a4c;
                border-color: #148a4c;
            }

            .post-tag {
                background-color: #e1ecf4;
                color: #39739d;
            }

            .text-brand,
            .text-devquery {
                color: #f48024;
            }
        </style>

        <style id="global-dark-mode">
            /* =================================================== */
            /* Light Mode Variables (Default)                      */
            /* =================================================== */
            :root {
                --bg-body: #ffffff;
                --bg-panel: #ffffff;
                --bg-input: #ffffff;
                --border-color: #d6d9dc;

                --text-primary: #232629;
                --text-secondary: #525960;
                --text-muted: #6a737c;
                --icon-color: #6a737c;

                --link-color: #0074cc;
                --link-hover: #0a95ff;
                --btn-hover-bg: #f8f9f9;

                --tag-bg: #e1ecf4;
                --tag-text: #39739d;

                --gold-bg: #fdf7e2;
                --gold-border: #f1e5bc;
                --gold-text: #8a6d3b;

                --silver-bg: #f8f9f9;
                --silver-border: #adb5bd;
                --silver-text: #555555;

                --bronze-bg: #fff5ee;
                --bronze-border: #d35400;
                --bronze-text: #a0522d;
            }

            /* =================================================== */
            /* Dark Mode Variables                                 */
            /* =================================================== */
            body.dark-theme {
                --bg-body: #2d3135;
                --bg-panel: #232629;
                --bg-input: #1a1b1d;
                --border-color: #4a4e51;

                --text-primary: #f1f2f3;
                --text-secondary: #babfc4;
                --text-muted: #9fa6ad;
                --icon-color: #babfc4;

                --link-color: #379fef;
                --link-hover: #58a6ff;
                --btn-hover-bg: #3b4045;

                --tag-bg: #373c3f;
                --tag-text: #9cc3db;

                --gold-bg: #3b3315;
                --gold-border: #d4a81e;
                --gold-text: #f1c40f;

                --silver-bg: #2d3135;
                --silver-border: #b4b8bc;
                --silver-text: #c4c8cc;

                --bronze-bg: #3b2a1e;
                --bronze-border: #ab825f;
                --bronze-text: #c98c62;
            }

            body.dark-theme {
                background-color: var(--bg-body) !important;
                color: var(--text-primary) !important;
            }

            body.dark-theme .main-container {
                background-color: var(--bg-body) !important;
                border-color: var(--border-color) !important;
            }

            body.dark-theme .left-sidebar,
            body.dark-theme .border-bottom,
            body.dark-theme .border-top {
                border-color: var(--border-color) !important;
            }

            body.dark-theme h1,
            body.dark-theme h2,
            body.dark-theme h3,
            body.dark-theme h4,
            body.dark-theme h5,
            body.dark-theme .text-dark,
            body.dark-theme .fw-bold,
            body.dark-theme .user-name {
                color: var(--text-primary) !important;
            }

            body.dark-theme p,
            body.dark-theme .text-secondary,
            body.dark-theme .user-meta {
                color: var(--text-secondary) !important;
            }

            body.dark-theme .text-muted,
            body.dark-theme .small {
                color: var(--text-muted) !important;
            }

            body.dark-theme i.fa-solid,
            body.dark-theme i.fa-regular,
            body.dark-theme i.fa-brands,
            body.dark-theme .nav-icon {
                color: var(--icon-color) !important;
            }

            body.dark-theme .active .nav-icon {
                color: var(--text-primary) !important;
            }

            /* =================================================== */
            /* Common UI Components                                */
            /* =================================================== */
            body.dark-theme a.so-link {
                color: var(--link-color) !important;
            }

            body.dark-theme a.so-link:hover {
                color: var(--link-hover) !important;
            }

            body.dark-theme .so-panel,
            body.dark-theme .card,
            body.dark-theme .edit-card,
            body.dark-theme .so-list-container,
            body.dark-theme .prefs-container,
            body.dark-theme .tag-card {
                background-color: var(--bg-panel) !important;
                border-color: var(--border-color) !important;
            }

            body.dark-theme input.form-control,
            body.dark-theme select.form-select,
            body.dark-theme .search-box {
                background-color: #1a1b1d !important;
                border-color: var(--border-color) !important;
                color: var(--text-primary) !important;
            }

            body.dark-theme .nav-link-sb:hover,
            body.dark-theme .saves-sidebar-item:hover,
            body.dark-theme .list-group-item:hover,
            body.dark-theme .so-list-item:hover {
                background-color: var(--btn-hover-bg) !important;
                color: var(--text-primary) !important;
            }

            body.dark-theme .nav-link-sb.active {
                background-color: var(--btn-hover-bg) !important;
                color: var(--text-primary) !important;
                border-left-color: #f48024 !important;
            }

            body.dark-theme .list-group-item {
                background-color: transparent !important;
                color: var(--text-secondary) !important;
            }

            body.dark-theme .post-tag,
            body.dark-theme .badge[style*="background-color: #e1ecf4"] {
                background-color: var(--tag-bg) !important;
                color: var(--tag-text) !important;
                border: 1px solid var(--border-color) !important;
            }

            body.dark-theme .sticker-gold,
            body.dark-theme .chip-gold {
                background-color: var(--gold-bg) !important;
                border-color: var(--gold-border) !important;
                color: var(--gold-text) !important;
            }

            body.dark-theme .sticker-silver,
            body.dark-theme .chip-silver {
                background-color: var(--silver-bg) !important;
                border-color: var(--silver-border) !important;
                color: var(--silver-text) !important;
            }

            body.dark-theme .sticker-bronze,
            body.dark-theme .chip-bronze {
                background-color: var(--bronze-bg) !important;
                border-color: var(--bronze-border) !important;
                color: var(--bronze-text) !important;
            }

            body.dark-theme .sticker-gold *,
            body.dark-theme .sticker-silver *,
            body.dark-theme .sticker-bronze * {
                color: var(--text-primary) !important;
            }

            body.dark-theme .navbar-devquery {
                background-color: var(--bg-panel, #232629) !important;
                border-bottom: 1px solid var(--border-color, #4a4e51) !important;
                transition: background-color 0.3s ease, border-color 0.3s ease;
            }

            body.dark-theme .navbar-devquery .text-dark,
            body.dark-theme .navbar-devquery .fw-bold {
                color: var(--text-primary, #f1f2f3) !important;
                transition: color 0.3s ease;
            }

            body.dark-theme .navbar-devquery .text-secondary {
                color: var(--icon-color, #babfc4) !important;
            }

            body.dark-theme .navbar-devquery .bg-light {
                background-color: var(--bg-input, #1a1b1d) !important;
                border-color: var(--border-color, #4a4e51) !important;
            }

            body.dark-theme .sidebar-heading {
                color: #a1a8ae !important;
                font-weight: 600 !important;
            }

            body.dark-theme .nav-link-sb {
                color: #c8ccd0 !important;
            }

            body.dark-theme .nav-icon {
                color: #a1a8ae !important;
            }

            body.dark-theme .nav-link-sb.active {
                color: #ffffff !important;
                background-color: #3b4045 !important;
            }

            body.dark-theme .nav-link-sb.active .nav-icon {
                color: #ffffff !important;
            }

            body.dark-theme .s-sidebarwidget,
            body.dark-theme [style*="background-color: #fdf7e2"],
            body.dark-theme [style*="background-color: #fffdf0"] {
                background-color: var(--gold-bg) !important;
                border-color: var(--gold-border) !important;
            }

            body.dark-theme .s-sidebarwidget *,
            body.dark-theme [style*="background-color: #fdf7e2"] * {
                color: var(--text-primary) !important;
            }

            body.dark-theme .btn-group .btn,
            body.dark-theme .btn-group .btn.bg-white {
                background-color: var(--bg-panel) !important;
                border-color: var(--border-color) !important;
                color: var(--text-secondary) !important;
            }

            body.dark-theme .btn-group .btn:hover,
            body.dark-theme .btn-group .btn.active {
                background-color: var(--btn-hover-bg) !important;
                color: var(--text-primary) !important;
            }

            body.dark-theme .badge.bg-white,
            body.dark-theme .badge.bg-light,
            body.dark-theme .badge[style*="background-color: #fff"] {
                background-color: var(--tag-bg) !important;
                color: var(--tag-text) !important;
                border: 1px solid var(--border-color) !important;
            }

            body.dark-theme input.form-control::placeholder,
            body.dark-theme .search-box::placeholder {
                color: var(--text-muted) !important;
                opacity: 1 !important;
            }

            /* =================================================== */
            /* Bootstrap Pagination Overrides                      */
            /* =================================================== */
            body.dark-theme .page-link {
                background-color: var(--bg-panel, #232629) !important;
                border-color: var(--border-color, #4a4e51) !important;
                color: var(--text-secondary, #babfc4) !important;
                transition: background-color 0.2s ease, color 0.2s ease;
            }

            body.dark-theme .page-link:hover {
                background-color: var(--btn-hover-bg, #3b4045) !important;
                color: var(--text-primary, #f1f2f3) !important;
            }

            /* Ensure active pagination items align with the DevQuery brand color */
            body.dark-theme .page-item.active .page-link {
                background-color: #f48024 !important;
                border-color: #f48024 !important;
                color: #ffffff !important;
                font-weight: 600 !important;
            }

            /* Reduce opacity for disabled pagination controls to indicate inactivity */
            body.dark-theme .page-item.disabled .page-link {
                background-color: var(--bg-body, #2d3135) !important;
                color: var(--text-muted, #9fa6ad) !important;
                border-color: var(--border-color, #4a4e51) !important;
                opacity: 0.5 !important;
            }

            body.dark-theme i.text-warning,
            body.dark-theme .text-warning {
                color: var(--gold-text, #f1c40f) !important;
            }

            body.dark-theme i.text-primary,
            body.dark-theme .text-primary {
                color: var(--link-color, #379fef) !important;
            }

            body.dark-theme i.text-success,
            body.dark-theme .text-success {
                color: #48a868 !important;
            }

            body.dark-theme i.text-danger,
            body.dark-theme .text-danger {
                color: #d0393e !important;
            }

            /* =================================================== */
            /* Dark Mode Overrides for Guide Pages                 */
            /* =================================================== */

            /* Enforce dark panel backgrounds for structural elements to maintain theme consistency */
            body.dark-theme .page-hero,
            body.dark-theme .section-card,
            body.dark-theme .guide-item,
            body.dark-theme .workflow-item {
                background-color: var(--bg-panel, #232629) !important;
                border-color: var(--border-color, #4a4e51) !important;
            }

            /* Override default white backgrounds in section headers for readability */
            body.dark-theme .section-header {
                background-color: var(--bg-input, #1a1b1d) !important;
                border-bottom-color: var(--border-color, #4a4e51) !important;
            }

            body.dark-theme .section-header h2 {
                color: var(--text-primary, #f1f2f3) !important;
            }

            body.dark-theme .section-header span {
                color: var(--text-muted, #9fa6ad) !important;
            }

            body.dark-theme .rule-number,
            body.dark-theme .guide-icon,
            body.dark-theme .workflow-step {
                background-color: var(--tag-bg, #373c3f) !important;
                color: var(--text-primary, #f1f2f3) !important;
            }

            body.dark-theme .rule-item {
                border-bottom-color: var(--border-color, #4a4e51) !important;
            }

            /* Adapt outline buttons for visibility on dark backgrounds */
            body.dark-theme .btn-outline-custom {
                background-color: transparent !important;
                border-color: var(--border-color, #4a4e51) !important;
                color: var(--text-secondary, #babfc4) !important;
            }

            body.dark-theme .btn-outline-custom:hover {
                background-color: var(--btn-hover-bg, #3b4045) !important;
                color: var(--text-primary, #f1f2f3) !important;
            }

            /* Retain contextual colors (yellow/blue) for widgets without blinding contrast */
            body.dark-theme .widget-yellow {
                background-color: var(--gold-bg, #3b3315) !important;
                border-color: var(--gold-border, #d4a81e) !important;
            }

            body.dark-theme .widget-blue {
                background-color: var(--tag-bg, #373c3f) !important;
                border-color: var(--border-color, #4a4e51) !important;
            }

            body.dark-theme .widget-header {
                background-color: transparent !important;
                border-bottom-color: var(--border-color, #4a4e51) !important;
                color: var(--text-primary, #f1f2f3) !important;
            }

            body.dark-theme .widget-list li {
                border-bottom-color: var(--border-color, #4a4e51) !important;
                color: var(--text-secondary, #babfc4) !important;
            }

            body.dark-theme .tags-header p,
            body.dark-theme .tag-description,
            body.dark-theme .q-excerpt,
            body.dark-theme .tag-desc {
                color: var(--text-secondary, #babfc4) !important;
            }

            /* Optimize tag readability in dark mode */
            body.dark-theme .tag-name-badge,
            body.dark-theme .tag-badge,
            body.dark-theme .q-tag {
                background-color: var(--tag-bg, #373c3f) !important;
                color: var(--tag-text, #9cc3db) !important;
                border: 1px solid var(--border-color, #4a4e51) !important;
            }

            body.dark-theme .tag-badge:hover,
            body.dark-theme .q-tag:hover {
                background-color: var(--border-color, #4a4e51) !important;
            }

            body.dark-theme .tags-controls .search-box input {
                background-color: var(--bg-input, #1a1b1d) !important;
                color: var(--text-primary, #f1f2f3) !important;
                border-color: var(--border-color, #4a4e51) !important;
            }

            body.dark-theme .tags-controls .search-box input:focus {
                border-color: var(--link-hover, #58a6ff) !important;
            }

            /* Ensure filter and sort button groups seamlessly blend into the dark UI */
            body.dark-theme .filter-buttons,
            body.dark-theme .sort-buttons {
                border-color: var(--border-color, #4a4e51) !important;
                background-color: transparent !important;
            }

            body.dark-theme .filter-buttons a,

            /* Notification Dropdown Styles */

        <div th:replace="~{Common/chatbot :: chatbot-widget}"></div>

        <!-- =====================================================
             SSE Real-Time Notification Client
             Opens EventSource once per page load for the
             authenticated user and updates the badge instantly.
        ====================================================== -->
        <script sec:authorize="!hasAnyRole('ADMIN','MODERATOR')" th:if="${loggedInUser != null}" th:inline="javascript">
        (function () {
            var userId = /*[[${loggedInUser.userId}]]*/ null;
            const readingNotifications = new Set();
            if (!userId) return;

            // Utilities
            function timeAgo(date) {
                const seconds = Math.floor((new Date() - date) / 1000);
                let interval = seconds / 31536000;
                if (interval > 1) return Math.floor(interval) + " years ago";
                interval = seconds / 2592000;
                if (interval > 1) return Math.floor(interval) + " months ago";
                interval = seconds / 86400;
                if (interval > 1) return Math.floor(interval) + " days ago";
                interval = seconds / 3600;
                if (interval > 1) return Math.floor(interval) + " hours ago";
                interval = seconds / 60;
                if (interval > 1) return Math.floor(interval) + " mins ago";
                return "Just now";
            }
            function getNotificationIcon(type, content) {
                if(type === "VOTE_QUESTION" || type === "VOTE_ANSWER"){

                if(content.toLowerCase().includes("downvote")){
                    return '<i class="fa-solid fa-thumbs-down text-warning"></i>';
                }

                return '<i class="fa-solid fa-thumbs-up text-warning "></i>';
                }
                switch (type) {
                    case 'NEW_ANSWER':
                        return '<i class="fa-solid fa-comment-dots text-primary"></i>';

                    case 'ANSWER_ACCEPTED':
                        return '<i class="fa-solid fa-circle-check text-success"></i>';

                    case 'ANSWER_UNACCEPTED':
                        return '<i class="fa-solid fa-circle-xmark text-danger"></i>';

                    case 'COMMENT_QUESTION':
                        return '<i class="fa-solid fa-message text-info"></i>';
                    case 'COMMENT_ANSWER':
                        return '<i class="fa-solid fa-comments text-info"></i>';
                    
                    case 'REPORT_QUESTION':
                        return '<i class="fa-solid fa-flag text-danger"></i>';
                    case 'REPORT_ANSWER':
                        return '<i class="fa-solid fa-triangle-exclamation text-danger"></i>';
                    case 'REPORT_COMMENT':
                        return '<i class="fa-solid fa-flag text-danger"></i>';

                    case 'NEW_BOUNTY':
                        return '<i class="fa-solid fa-trophy text-warning"></i>';

                    case 'REPUTATION_CHANGED':
                        return '<i class="fa-solid fa-star text-warning"></i>';

                    case 'TAG_POST':
                        return '<i class="fa-solid fa-tag text-primary"></i>';

                    default:
                        return '<i class="fa-solid fa-bell"></i>';
                }
            }
            

            function createNotiItem(n) {
                const div = document.createElement('a');
                div.className =
                'noti-item ' + (n.isRead ? '' : 'unread');
                div.href = '#';
                div.setAttribute('data-id', n.notificationId);
                div.onclick = async function(e) {
                    e.preventDefault();
                    if (!n.isRead) {
                        readingNotifications.add(n.notificationId);
                    n.isRead = true;
                    div.classList.remove("unread");
                    decreaseBadge();
                    setTimeout(() => {
                        readingNotifications.delete(n.notificationId);
                    }, 2000);

                    // Gửi request nền, không chờ
                    fetch('/notifications/' + n.notificationId + '/read', {
                    method: 'PUT'
                    }).catch(console.error);
                    }
                    let url = '/question?id=' + n.questionId;

                    if (n.answerId) {
                        url += '#answer-' + n.answerId;
                    }

                    if (n.commentId) {
                        url += '#comment-' + n.commentId;
                    }

                    window.location.href = url;
                };
                // These types already build "{username} ..." directly inside n.content
                // (see NotificationServiceImpl / *ServiceImpl call sites), so showing the
                // bold senderName here as well would duplicate the name. Bounty Reward
                // (REPUTATION_CHANGED) is intentionally left showing both.
                const HIDE_SENDER_TYPES = [
                'REPORT_QUESTION',
                'REPORT_ANSWER',
                'REPORT_COMMENT',
                'VOTE_QUESTION',
                'VOTE_ANSWER',
                'NEW_BOUNTY'
                ];
                const NOTI_TYPES_WITH_NAME_IN_CONTENT = [
                'NEW_ANSWER',
                'COMMENT_QUESTION',
                'COMMENT_ANSWER'
                ];
                HIDE_SENDER_TYPES.push("REPUTATION_CHANGED");
                let senderNameHtml = '';

                if (
                !NOTI_TYPES_WITH_NAME_IN_CONTENT.includes(n.type) &&
                !HIDE_SENDER_TYPES.includes(n.type) &&
                n.senderName
                ) {
                senderNameHtml = `<strong>${n.senderName}</strong> `;
                }
                div.innerHTML = `
                    <div class="noti-content-wrapper">

                    <div class="noti-icon">
                        ${getNotificationIcon(n.type, n.content)}
                    </div>

                    <div class="noti-content">
                    <div class="fw-semibold small">
                        ${senderNameHtml}
                        ${n.content}
                    </div>
                    <div class="small text-primary mt-1">
                        ${n.questionTitle ?? ''}
                    </div>

                        ${n.preview ? `
                    <div class="small text-muted mt-1">
                        "${n.preview}"
                    </div>
                    ` : ''}


                    <div class="noti-time">
                        ${timeAgo(new Date(n.createdAt))}
                    </div>
                    </div>

                </div>
            `;
                return div;
            }
            function decreaseBadge() {

            const badge = document.getElementById("noti-badge-count");

            if (!badge) return;

            let count = parseInt(badge.textContent) || 0;

            count = Math.max(0, count - 1);

            if (count === 0) {
                badge.style.display = "none";
            } else {
                badge.textContent = count;
            }
            }

            function fetchNotifications() {
                const list = document.getElementById('noti-list');
                list.innerHTML = '<div class="p-3 text-center text-secondary small">Loading...</div>';
                fetch('/notifications/' + userId)
                    .then(r => r.json())
                    .then(notifs => {
                        list.innerHTML = '';
                        if (notifs.length === 0) {
                            list.innerHTML = '<div class="p-3 text-center text-secondary small">No notifications</div>';
                            return;
                        }
                        notifs.forEach(n => list.appendChild(createNotiItem(n)));
                    })
                    .catch(err => {
                        list.innerHTML = '<div class="p-3 text-center text-danger small">Failed to load</div>';
                    });
            }

            // Dropdown Toggle
            const bellLink = document.getElementById('noti-bell-link');
            const dropdown = document.getElementById('noti-dropdown-menu');
            
            if (bellLink && dropdown) {
                bellLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    const isClosed = dropdown.classList.contains('d-none');
                    dropdown.classList.toggle('d-none');
                    if (isClosed) {
                        fetchNotifications();
                    }
                });

                // Click outside to close
                document.addEventListener('click', function(e) {
                    const bellItem = document.getElementById('noti-bell-item');
                    if (bellItem && !bellItem.contains(e.target)) {
                        dropdown.classList.add('d-none');
                    }
                });
            }

            // Mark all as read
            const markAllBtn = document.getElementById('noti-mark-all');
            if (markAllBtn) {
                markAllBtn.addEventListener('click', function (e) {
                e.preventDefault();

                const unreadItems = Array.from(document.querySelectorAll('.noti-item.unread'));

                if (unreadItems.length === 0) return;

                // Gọi 1 API duy nhất
                fetch('/notifications/read-all/' + userId, {
                     method: 'PUT'
                })
                .then(() => {

                    // Update UI ngay
                    unreadItems.forEach(item => {
                        item.classList.remove('unread');
                    });

                    // Xóa badge
                    const badge = document.getElementById('noti-badge-count');
                    if (badge) {
                            badge.remove();
                    }

                })
            .catch(console.error);
         });
        }

            // Prevent duplicate EventSource on Turbolinks / fragment reload
            if (window.__sseNotifSource) return;

            var es = new EventSource('/notifications/stream/' + userId);
            window.__sseNotifSource = es;

            es.addEventListener('notification', function (event) {
                try {
                    let n = JSON.parse(event.data);
                    if (n.isRead !== undefined) n.read = n.isRead; 
                    if (readingNotifications.has(n.notificationId)) {
                        return;
                    }
                    incrementBadge();
                    
                    const list = document.getElementById('noti-list');
                    if (list) {
                        if (!dropdown.classList.contains('d-none')) {
                            if (!list.querySelector('.noti-item')) list.innerHTML = '';
                            list.prepend(createNotiItem(n));
                        }
                    }
                } catch(e) {}
            });

            function incrementBadge() {
                var badge = document.getElementById('noti-badge-count');
                if (badge) {
                    var current = parseInt(badge.textContent, 10) || 0;
                    badge.textContent = current + 1;
                } else {
                    var bellItem = document.getElementById('noti-bell-item');
                    if (bellItem) {
                        var anchor = document.getElementById('noti-bell-link');
                        var newBadge = document.createElement('span');
                        newBadge.id = 'noti-badge-count';
                        newBadge.className = 'noti-badge';
                        newBadge.textContent = '1';
                        anchor.appendChild(newBadge);
                    }
                }
            }
        })();
        </script>
