<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - DevQuery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
body {
    background-color: #f1f2f3;
    font-family: Arial, sans-serif;
}

.reset-container {
    max-width: 420px;
    margin: 90px auto;
    background: white;
    padding: 28px;
    border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.12);
}

.btn-primary {
    background-color: #0a95ff;
    border-color: #0a95ff;
}
        /* Success Modal */
#successModal .modal-content {
    border:none;
    border-radius:22px;
    overflow:visible;
    box-shadow:0 25px 60px rgba(0,0,0,.18);
}

#successModal .modal-header {
    justify-content: center;
    padding: 24px 24px 10px;
}

#successModal .modal-title {
    font-size: 24px;
    font-weight: 700;
    color: #198754;
}

#successModal .modal-body {
    text-align: center;
    padding: 10px 32px 20px;
}

#successModal .success-message {
    color: #555;
    font-size: 16px;
    line-height: 1.6;
}

#successModal .modal-footer {
    justify-content: center;
    border-top: none;
    padding-bottom: 24px;
}
.btn-login{
    min-width:180px;
    padding:12px 20px;
    border-radius:999px;
    border:none;
    background:#0a95ff;
    color:#fff;
    font-weight:600;
    transition:all .25s ease;
}

.btn-login:hover{
    background:#0074cc;
    color:#fff;
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(10,149,255,.35);
}

#successModal .modal-content {
    animation: popupScale .45s cubic-bezier(.18,.89,.32,1.28);
}

@keyframes popupScale {
    from {
        transform: scale(.85);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}
.success-icon{
    position:relative;
    width:95px;
    height:95px;
    margin:15px auto 30px;
    border-radius:50%;
    background:#b8ff90;
    display:flex;
    align-items:center;
    justify-content:center;
    animation:bounce .5s ease;
    
}
.success-icon{

    box-shadow:
        0 0 0 10px rgba(170,255,170,.45);

    animation:
        bounce .6s ease,
        pulse 2s infinite;

}
@keyframes pulse{

    0%{

        box-shadow:
        0 0 0 0 rgba(170,255,170,.55);

    }

    70%{

        box-shadow:
        0 0 0 18px rgba(170,255,170,0);

    }

    100%{

        box-shadow:
        0 0 0 0 rgba(170,255,170,0);

    }

}
.success-icon i{
    font-size:42px;
    color:#2b8a3e;
}
.success-icon::before,
.success-icon::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:#8df24a;
    animation:float 2s infinite;
}

.success-icon::before{
    width:10px;
    height:10px;
    left:-8px;
    top:18px;
}

.success-icon::after{
    width:8px;
    height:8px;
    right:-10px;
    bottom:18px;
}
.dot1,
.dot2,
.dot3{
    position:absolute;
    border-radius:50%;
    background:#7cff3a;
}

.dot1{
    width:6px;
    height:6px;
    top:10px;
    right:-2px;
}

.dot2{
    width:8px;
    height:8px;
    left:0;
    bottom:5px;
}

.dot3{
    width:5px;
    height:5px;
    left:12px;
    top:0;
}
@keyframes bounce{

    0%{
        transform:scale(.2);
        opacity:0;
    }

    60%{
        transform:scale(1.15);
    }

    100%{
        transform:scale(1);
    }

}

@keyframes float{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

    100%{
        transform:translateY(0);
    }

}
.btn-login{

    width:180px;
    border-radius:999px;
    font-weight:600;
    padding:10px;

}
.modal-title{

    color:#198754;
    font-size:30px;
    font-weight:700;

}
.error-modal{
    border:none;
    border-radius:20px;
    box-shadow:0 25px 60px rgba(0,0,0,.18);
}

.error-icon{
    width:90px;
    height:90px;
    margin:10px auto 24px;
    border-radius:50%;
    background:#ffd6d6;
    display:flex;
    justify-content:center;
    align-items:center;
    animation:bounce .5s ease;
}

.error-icon i{
    font-size:42px;
    color:#dc3545;
}

.error-message{
    color:#555;
    line-height:1.6;
    white-space:pre-line;
}
</style>
</head>
<body>
    

<div class="reset-container" th:if="${success == null}">
    <h3 class="mb-3">Reset password</h3>

    <div class="modal fade"
    id="errorModal"
    data-bs-backdrop="static"
    data-bs-keyboard="false"
    tabindex="-1"
    th:if="${error}">
        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content error-modal">

                <div class="modal-header border-0 justify-content-center">
                    <h4 class="modal-title text-danger">
                        Password Reset Failed
                    </h4>
                </div>

            <div class="modal-body text-center">

                <div class="error-icon">
                    <i class="bi bi-x-circle-fill"></i>
                </div>

                <p class="error-message" th:utext="${error}"></p>

            </div>

            <div class="modal-footer border-0 justify-content-center">

                <button type="button"
                        class="btn btn-danger px-4"
                        data-bs-dismiss="modal">
                    Try Again
                </button>

            </div>

            </div>

        </div>

    </div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <form th:if="${token != null}" th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">

        <div class="mb-3">
            <label for="password" class="form-label">New password</label>

            <input type="password"
                   id="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter new password"
                   required>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm password</label>

            <input type="password"
                   id="confirmPassword"
                   name="confirmPassword"
                   class="form-control"
                   placeholder="Confirm new password"
                   required>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Reset password
        </button>
    </form>

    <div class="text-center mt-3">
        <a th:href="@{/auth/login}">Back to login</a>
    </div>
</div>
<div class="modal fade"
        id="successModal"
        data-bs-backdrop="static"
        data-bs-keyboard="false"
        tabindex="-1"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header border-0">
                    <h5 class="modal-title text-success">
                        Password Reset Successful
                    </h5>
                </div>

                <div class="modal-body text-center">

                    <div class="success-icon">

                        <i class="bi bi-check-circle-fill"></i>

                        <span class="dot1"></span>
                        <span class="dot2"></span>
                        <span class="dot3"></span>

                    </div>

                    <p class="success-message"
                    th:text="${success}">
                        Your password has been reset successfully.
                    </p>

                </div>

                <div class="modal-footer border-0 justify-content-center">

                    <a th:href="@{/auth/login}"
                         class="btn btn-login">
                        Back to Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:if="${success}">
    document.addEventListener("DOMContentLoaded", function () {

    const modal = new bootstrap.Modal(
        document.getElementById("successModal")
    );

    modal.show();

    });
</script>
<script th:if="${error}">
document.addEventListener("DOMContentLoaded", function () {

    const modal = new bootstrap.Modal(
        document.getElementById("errorModal")
    );

    modal.show();

});
</script>
