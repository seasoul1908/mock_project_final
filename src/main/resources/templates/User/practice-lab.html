<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice Lab - DevQuery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        if (localStorage.getItem('devquery-theme') === 'dark') {
            document.write('<style>body { background-color: #2d3135 !important; }</style>');
        }
    </script>
    <style>
        body {
            background-color: var(--bg-body, #fff);
            padding-top: 60px;
            color: var(--text-primary, #232629);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Adjusted", "Segoe UI", "Liberation Sans", sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .main-container {
            display: flex;
            max-width: 1264px;
            margin: 0 auto;
            width: 100%;
            padding: 0;
            position: relative;
        }

        .left-sidebar {
            width: 164px;
            flex-shrink: 0;
            border-right: 1px solid #d6d9dc;
        }

        .main-content {
            flex-grow: 1;
            padding: 24px;
            min-width: 0;
        }
    </style>
</head>

<body>
    <div th:replace="~{Common/header :: header}"></div>

    <div class="main-container">
        <div class="left-sidebar d-none d-md-block">
            <div th:replace="~{Common/sidebar :: sidebar('practice-lab')}"></div>
        </div>

        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 text-dark font-weight-bold">Practice Lab</h2>
                <div class="d-flex gap-2">
                    <select id="languageSelect" class="form-select w-auto shadow-sm">
                        <option value="java" data-version="15.0.2">Java</option>
                        <option value="python" data-version="3.12.0">Python</option>
                        <option value="javascript" data-version="20.11.1">JavaScript (Node.js)</option>
                        <option value="c" data-version="10.2.0">C</option>
                        <option value="cpp" data-version="10.2.0">C++</option>
                        <option value="csharp" data-version="6.12.0">C#</option>
                        <option value="go" data-version="1.16.2">Go</option>
                        <option value="rust" data-version="1.68.2">Rust</option>
                    </select>
                    <button id="runBtn" class="btn btn-primary shadow-sm d-flex align-items-center gap-2">
                        <i class="fa-solid fa-play"></i>
                        <span>Run Code</span>
                        <div id="runSpinner" class="spinner-border spinner-border-sm d-none" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </button>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white border-bottom-0 pt-3">
                            <h6 class="mb-0 text-muted"><i class="fa-solid fa-code"></i> Code Editor</h6>
                        </div>
                        <div class="card-body p-0">
                            <div id="editor"
                                style="height: 65vh; border: 1px solid #e9ecef; border-radius: 0 0 0.375rem 0.375rem;">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4 mt-3 mt-lg-0">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-header bg-white border-bottom-0 pt-3">
                            <h6 class="mb-0 text-muted"><i class="fa-solid fa-terminal"></i> Output</h6>
                        </div>
                        <div class="card-body bg-dark text-light overflow-auto rounded-bottom" style="height: 65vh;">
                            <pre id="outputConsole" class="m-0"
                                style="white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; font-size: 14px;">Ready to run your code...</pre>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{Common/footer :: footer}"></div>

    <!-- Monaco Editor Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        // Configure Monaco Loader
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' } });

        let editor;
        const defaultCode = {
            java: 'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello, DevQuery!");\n    }\n}',
            python: 'print("Hello, DevQuery!")',
            javascript: 'console.log("Hello, DevQuery!");',
            c: '#include <stdio.h>\n\nint main() {\n    printf("Hello, DevQuery!\\n");\n    return 0;\n}',
            cpp: '#include <iostream>\n\nint main() {\n    std::cout << "Hello, DevQuery!" << std::endl;\n    return 0;\n}',
            csharp: 'using System;\n\nclass Program {\n    static void Main() {\n        Console.WriteLine("Hello, DevQuery!");\n    }\n}',
            go: 'package main\n\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Hello, DevQuery!")\n}',
            rust: 'fn main() {\n    println!("Hello, DevQuery!");\n}',
            kotlin: 'fun main() {\n    println("Hello, DevQuery!")\n}'
        };

        // Initialize Editor
        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: defaultCode.java,
                language: 'java',
                theme: 'vs-light',
                automaticLayout: true,
                minimap: { enabled: false },
                fontSize: 14
            });
        });

        // Handle Language Change
        const languageSelect = document.getElementById('languageSelect');
        languageSelect.addEventListener('change', (e) => {
            const lang = e.target.value;
            monaco.editor.setModelLanguage(editor.getModel(), lang);
            editor.setValue(defaultCode[lang] || '');
        });

        // Handle Piston API Execution
        document.getElementById('runBtn').addEventListener('click', async () => {
            const runBtn = document.getElementById('runBtn');
            const runSpinner = document.getElementById('runSpinner');
            const outputConsole = document.getElementById('outputConsole');
            const selectedOption = languageSelect.options[languageSelect.selectedIndex];

            const language = selectedOption.value;
            const version = selectedOption.getAttribute('data-version');
            const code = editor.getValue();

            // Set UI Loading state
            runBtn.disabled = true;
            runSpinner.classList.remove('d-none');
            outputConsole.textContent = "Executing code on Piston backend...";
            outputConsole.style.color = "#adb5bd"; // muted color for loading

            try {
                // Route through our Spring Boot backend to our refactored endpoint
                const response = await fetch('/api/practice/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        language: language,
                        code: code
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    outputConsole.textContent = result.error || "Execution failed with status: " + response.status;
                    outputConsole.style.color = "#ff6b6b";
                    return;
                }

                // Process PracticeRunResponse
                if (result.success) {
                    outputConsole.textContent = result.output || "Code executed successfully with no output.";
                    outputConsole.style.color = "#51cf66"; // green (success)
                } else {
                    let errorMsg = result.error || "An unknown error occurred.";
                    if (result.output) {
                        errorMsg += "\n\nStandard Output:\n" + result.output;
                    }
                    outputConsole.textContent = errorMsg;
                    outputConsole.style.color = "#ff6b6b"; // red (error)
                }

                if (result.executionTime !== undefined) {
                    // Optional: append execution time
                    outputConsole.textContent += `\n\n[Execution Time: ${result.executionTime}ms]`;
                }

            } catch (error) {
                outputConsole.textContent = "Error communicating with the execution server: " + error.message;
                outputConsole.style.color = "#ff6b6b";
            } finally {
                // Reset UI state
                runBtn.disabled = false;
                runSpinner.classList.add('d-none');
            }
        });
        /*]]>*/
    </script>
</body>

</html>
